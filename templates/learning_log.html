<!DOCTYPE html>
<html>

<head>
    <title>Learning Log</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <h1>Learning Log</h1>

    <form action="/learning_log" method="POST">

        <label>Date</label><br>
        <input type="date" name="date" required><br><br>

        <label>Topic</label><br>
        <input type="text" name="topic" required><br><br>

        <label>Hours Studied</label><br>
        <input type="number" name="hours" required><br><br>

        <label>Remarks</label><br>
        <input type="text" name="remarks" required><br><br>

        <button type="submit">
            Save Log
        </button>

    </form>

    <br><br>

    <h2>Learning History</h2>

    <table border="1" cellpadding="10">

        <tr>

            <th>Date</th>
            <th>Topic</th>
            <th>Hours</th>
            <th>Remarks</th>

        </tr>

        {% for log in logs %}

        <tr>

            <td>{{ log.date }}</td>
            <td>{{ log.topic }}</td>
            <td>{{ log.hours }}</td>
            <td>{{ log.remarks }}</td>

        </tr>

        {% endfor %}

    </table>

    <br>

    <a href="/command_center">
        Back
    </a>

</body>

</html>
