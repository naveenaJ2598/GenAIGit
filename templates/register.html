<!DOCTYPE html>
<html>

<head>

    <title>Register</title>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="container">

    <h1 class="mt-4 mb-4">Register</h1>

           {% if error %}

            <div class="alert alert-danger">

           {{ error }}

             </div>

           {% endif %}

    <form action="/register" method="POST">

        <label>Name</label><br>
        <input type="text" class="form-control" name="name" value="{{ name if name else '' }}"required><br>

   
        <label>Email</label><br>
        <input type="email" class="form-control" name="email" value="{{ email if email else '' }}" required><br>

        <label>Username</label><br>
        <input type="text" class="form-control" name="username" value="{{ username if username else '' }}" required><br>

        <label>Password</label><br>
        <input type="password" class="form-control" name="password" required><br>

        <label>Confirm Password</label><br>
        <input type="password" class="form-control" name="confirm_password" required><br>

        <button class="btn btn-primary" type="submit">
            Register
        </button>

    </form>

    <br>

    <a href="/">Back</a>

</div>

</body>

</html>
